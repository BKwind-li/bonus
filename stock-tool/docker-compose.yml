version: "3.9"

services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_PASSWORD: ${APP_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      DATABASE_URL: /data/data.db
    volumes:
      - backend_data:/data
    networks:
      - app

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ""
    networks:
      - app

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot
    networks:
      - app
    depends_on:
      - backend
      - frontend

volumes:
  backend_data:
  certbot_www:

networks:
  app:
    driver: bridge
